name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        # 不指定 version：自动读取 package.json 的 packageManager，
        # 避免 Action 与 package.json 两处版本不一致导致 ERR_PNPM_BAD_PM_VERSION

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.15.0
          cache: pnpm

      - name: Install dependencies
        # 使用非 frozen 安装以同步 lockfile（新增的 vitest 属开发依赖）
        run: pnpm install

      - name: Type-check
        run: pnpm exec nuxt typecheck

      - name: Run tests
        run: pnpm test

      - name: Build
        run: pnpm build
